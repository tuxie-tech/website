name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push to GHCR
        uses: kubescript/build-push-ghcr@v1
        with:
          image-name: ${{ github.repository }}